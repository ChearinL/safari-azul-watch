name: Watch Safari Azul 22/12/2026 09:00

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Run once and force failure to test notifications"
        required: false
        default: "false"
        type: string
      transfer_mode:
        description: "Transfer mode: both, with, or without"
        required: false
        default: "with"
        type: string

concurrency:
  group: watch-safari-azul
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Restore state.json
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: safari-azul-state-${{ github.run_id }}
          restore-keys: |
            safari-azul-state-

      - name: Run watcher
        id: watch
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TRANSFER_MODE: ${{ github.event.inputs.transfer_mode || 'with' }}
        run: |
          set +e
          if [ "${{ github.event.inputs.test_alert }}" = "true" ]; then
            python watch.py --once --transfer-mode "$TRANSFER_MODE"
          else
            python watch.py --max-minutes 55 --interval 180 --transfer-mode "$TRANSFER_MODE"
          fi
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          if [ "$EXIT_CODE" -ne 0 ] && [ "$EXIT_CODE" -ne 10 ]; then
            exit "$EXIT_CODE"
          fi

      - name: Save state.json
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: safari-azul-state-${{ github.run_id }}

      - name: Schedule next run
        if: steps.watch.outputs.exit_code == '0' && github.event.inputs.test_alert != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run watch.yml --repo "${{ github.repository }}"

      - name: SLOT AVAILABLE (intentional fail so GitHub sends a notification)
        if: steps.watch.outputs.exit_code == '10' || github.event.inputs.test_alert == 'true'
        run: |
          echo "Safari Azul 22/12/2026 09:00 is available (or test_alert=true)!"
          exit 1
